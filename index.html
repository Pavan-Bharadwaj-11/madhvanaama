        function renderShlokas() {
            const container = document.getElementById('shloka-container');
            container.innerHTML = '';

            let lastSection = '';
            shlokasData.forEach(item => {
                if (item.sectionTitle && item.section !== lastSection) {
                    lastSection = item.section;
                    const headerDiv = document.createElement('div');
                    headerDiv.id = item.section;
                    headerDiv.className = 'section-header text-center pt-4 pb-2';
                    headerDiv.innerHTML = `
                        <h2 class="text-xl md:text-2xl font-bold text-[#8B3A00] bg-amber-200/90 inline-block px-6 py-1.5 rounded-full shadow-sm border border-amber-300">
                            ${item.sectionTitle[currentLang]}
                        </h2>
                    `;
                    container.appendChild(headerDiv);
                }

                const card = document.createElement('div');
                card.className = 'shloka-card p-5 rounded-2xl relative shadow-sm';
                
                if (item.num) {
                    card.id = `shloka-${item.num}`;
                } else {
                    card.id = `pallavi-card`;
                }

                card.setAttribute('data-id', item.id);
                card.setAttribute('data-group', item.group || '');
                card.setAttribute('data-text-kn', (item.rawKn || item.kn).toLowerCase());
                card.setAttribute('data-text-en', (item.rawEn || item.en).toLowerCase());
                card.setAttribute('data-num', item.num);

                const verseText = (currentLang === 'kn' ? item.kn : item.en);

                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2 mb-2">
                        ${item.num ? `<span class="bg-[#8B3A00] text-amber-50 font-semibold text-xs px-2.5 py-0.5 rounded-md">|| ${item.num} ||</span>` : '<span></span>'}
                    </div>
                    <div class="text-base md:text-lg font-medium text-amber-950 leading-relaxed whitespace-pre-line">
                        ${verseText}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleLanguage() {
            currentLang = currentLang === 'kn' ? 'en' : 'kn';
            
            document.getElementById('app-title').innerText = currentLang === 'kn' ? 'ಶ್ರೀ ಮಧ್ವನಾಮ' : 'Madhavanama';
            document.getElementById('app-subtitle').innerText = currentLang === 'kn' ? 'ಶ್ರೀ ಶ್ರೀಪಾದರಾಜ ವಿರಚಿತ' : 'Composed by Sri Sripadaraja';
            document.getElementById('lang-btn-label').innerText = currentLang === 'kn' ? 'English' : 'ಕನ್ನಡ';
            document.getElementById('audio-btn-text').innerText = currentLang === 'kn' ? 'ಆಡಿಯೋ ಕೇಳಿ' : 'Listen Audio';
            document.getElementById('search-input').placeholder = currentLang === 'kn' ? 'ಶ್ಲೋಕ ಅಥವಾ ಸಂಖ್ಯೆಯನ್ನು ಹುಡುಕಿ...' : 'Search shloka text or number...';

            renderShlokas();
            filterShlokas();
            highlightGroupFromHash();
        }

        function scrollToSection(sectionId, btnElement) {
            const el = document.getElementById(sectionId);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth' });
            }

            const allTabs = document.querySelectorAll('.nav-btn');
            allTabs.forEach(tab => {
                tab.className = 'nav-btn bg-amber-200/80 text-[#8B3A00] hover:bg-amber-300 px-3 py-1 rounded-full whitespace-nowrap transition';
            });

            if (btnElement) {
                btnElement.className = 'nav-btn bg-[#8B3A00] text-white px-3 py-1 rounded-full whitespace-nowrap transition';
            }
        }

        function filterShlokas() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.shloka-card');
            
            cards.forEach(card => {
                const textKn = card.getAttribute('data-text-kn');
                const textEn = card.getAttribute('data-text-en');
                const num = card.getAttribute('data-num');

                if (query === '' || textKn.includes(query) || textEn.includes(query) || num.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function highlightGroupFromHash() {
            const hash = window.location.hash.replace('#', '');
            if (!hash) return;

            // Clear previous active highlights
            document.querySelectorAll('.shloka-card').forEach(c => c.classList.remove('card-group-active'));

            let targetNumbers = [];
            
            // Check if hash matches group-X or single shloka-N
            if (qrGroups[hash]) {
                targetNumbers = qrGroups[hash];
            } else if (hash.startsWith('shloka-')) {
                const n = parseInt(hash.replace('shloka-', ''));
                if (!isNaN(n)) targetNumbers = [n];
            }

            if (targetNumbers.length > 0) {
                setTimeout(() => {
                    const firstCard = document.getElementById(`shloka-${targetNumbers[0]}`);
                    if (firstCard) {
                        firstCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }

                    targetNumbers.forEach(num => {
                        const card = document.getElementById(`shloka-${num}`);
                        if (card) {
                            card.classList.add('card-group-active');
                        }
                    });
                }, 150);
            }
        }

        window.onload = function() {
            renderShlokas();
            highlightGroupFromHash();
        };

        window.onhashchange = function() {
            highlightGroupFromHash();
        };
    </script>
</body>
</html>
